openapi: 3.0.0
info:
  title: Payment API - Rukonpin Store
  version: 1.0.0
paths:
  /payments/{userUuid}/balance:
    get:
      tags: [Payment]
      summary: Получить баланс пользователя
      operationId: getBalance
      parameters:
        - name: userUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
  /payments/charge:
    post:
      tags: [Payment]
      summary: Списание баланса
      operationId: chargePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userUuid:
                  type: string
                  format: uuid
                orderUuid:
                  type: string
                  format: uuid
                amount:
                  type: number
              required: [userUuid, orderUuid, amount]
      responses:
        '200':
          description: Успешное списание
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
        '404':
          description: Пользователь не найден
        '422':
          description: Недостаточно средств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string